# 动作库 MOVES —— 首次签发 HTTPS 证书用的过渡配置（纯 HTTP，不引用任何证书）
#
# 为什么需要它：最终的 nginx.conf 引用 /etc/letsencrypt/live/.../fullchain.pem，
# 而那个文件要等 certbot 跑完才有。缺 ssl_certificate 是致命错误，nginx -t 直接失败，
# 所以必须先用这份纯 HTTP 配置把 Nginx 拉起来、让 ACME 校验路径可达，再签证书。
#
# 用法（详见 README「首次设置」）：
#   sudo cp deploy/nginx.bootstrap.conf /etc/nginx/sites-available/moves
#   sudo ln -sf /etc/nginx/sites-available/moves /etc/nginx/sites-enabled/moves
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d <你的域名> \
#        --deploy-hook "systemctl reload nginx"
#   # 证书就位后再换成最终的 deploy/nginx.conf
#
# 把 <your-domain.example> 换成你的真实域名。

server {
    listen 80;
    listen [::]:80;
    server_name <your-domain.example>;

    # ^~ 优先于正则 location，确保校验路径不被别的规则截走
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 证书还没签好之前，这里没有可服务的内容；给个明确的占位响应，
    # 免得裸 IP 或错误域名访问时看到 nginx 默认欢迎页。
    location / {
        default_type text/plain;
        return 200 "bootstrap ok — 证书签发中，站点尚未上线\n";
    }
}
