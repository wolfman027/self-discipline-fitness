# 动作库 MOVES —— Nginx 反代配置（最终版，证书签好之后再用）
#
# 不要一上来就装这份 —— 它引用的证书文件还不存在，缺 ssl_certificate 是致命错误，
# nginx 会起不来。首次签发证书请先按 README「首次设置」用 nginx.bootstrap.conf 过渡。
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/moves
#   sudo ln -s /etc/nginx/sites-available/moves /etc/nginx/sites-enabled/moves
#   sudo rm -f /etc/nginx/sites-enabled/default     # 否则裸 IP 会命中 nginx 默认欢迎页
#   sudo nginx -t && sudo systemctl reload nginx
#
# 把下面所有 <your-domain.example> 换成你的真实域名。

# ---------- 80：留给 ACME 校验，其余跳 HTTPS ----------
# 这一段不挂 basic auth，否则证书续期会失败。
server {
    listen 80;
    listen [::]:80;
    server_name <your-domain.example>;

    # ^~ 优先于正则 location，确保校验路径不被别的规则截走
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：正式站点 ----------
server {
    # 这里用的是「旧写法」，它在所有 Nginx 版本上都能工作（1.25.1+ 会提示 deprecated，
    # 只是警告不影响启动）。刻意不默认用新写法 `http2 on;` —— 那个指令 1.25.1 才引入，
    # 而 Ubuntu 22.04 是 1.18、Ubuntu 24.04 是 1.24、Debian 12 是 1.22，
    # 在旧版上它是 unknown directive，属于致命错误，nginx 直接不启动。
    # 确认 `nginx -v` >= 1.25.1 之后，可以把 http2 挪成单独一行 `http2 on;`。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <your-domain.example>;

    ssl_certificate     /etc/letsencrypt/live/<your-domain.example>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain.example>/privkey.pem;

    # TLS 参数直接内联，不 include /etc/letsencrypt/options-ssl-nginx.conf ——
    # 那个文件只有 certbot 的 nginx 插件会生成，我们用 --webroot 模式，它不存在，
    # include 进去会让 nginx -t 直接失败。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 确认全站 HTTPS 无误后再启用；includeSubDomains 会让回退变得很麻烦，故不加
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ==================== 授权门禁 ====================
    # 媒体素材（© Gym visual）尚未取得公开分发授权，先整体挡住。
    # 拿到授权后，注释掉下面两行再 reload 即可恢复公开访问：
    #   sudo systemctl reload nginx
    #
    # 已知影响：门禁对 /_next/static 同样生效（浏览器会为同源子资源自动重发凭据，
    # 所以页面正常）；但社交平台抓取器和 Lighthouse 这类无凭据客户端会拿到 401 ——
    # 这正是门禁期的预期行为。
    auth_basic "MOVES";
    auth_basic_user_file /etc/nginx/.htpasswd-moves;
    # ==================================================

    # 媒体由 Nginx 直发，不经过 Node：137MB 静态文件，长缓存。
    # 目录要单独准备并放开权限，见 README「补充媒体」。
    # 本轮为空 → 图片 404，前端降级成「暂无图示」占位，不影响页面其余部分。
    #
    # 只用 expires，不要再手写 add_header Cache-Control —— expires 本身就会发出
    # Cache-Control: max-age=...，两者叠加会产生重复的 Cache-Control 头。
    # 另外 location 里一旦出现 add_header，就不再继承 server 级的 HSTS。
    #
    # 取 7 天而非更长：素材文件名是 <id>-<media_id>，内容更新时文件名多半不变，
    # 缓太久用户会看到旧图。要更激进可改 expires 30d;
    #
    # location 与 alias 的结尾斜杠都是必须的：/media/img/x.jpg → /srv/media/img/x.jpg。
    # 少了斜杠会让 location /media 误匹配 /mediator 这类路径。
    location /media/ {
        alias /srv/media/;
        expires 7d;
        access_log off;
    }

    # 其余全部交给 Next。/ 首页是动态渲染的（筛选/搜索/分页走 URL 查询串），
    # 所以这里不能做 proxy_cache。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
}
